<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-header">
            <h1>Student Registration</h1>
            <p>Enter your details and select your subjects</p>
        </div>

        <form>

            <h2>Student Information</h2>

            <!-- Roll Number -->
            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll"
                       placeholder="Enter roll number" required>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="example@gmail.com" required>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number" required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">B.Tech Year</label>

                <select id="year" name="year" required>
                    <option value="">-- Select Year --</option>
                    <option value="1st">1st Year</option>
                    <option value="2nd">2nd Year</option>
                    <option value="3rd">3rd Year</option>
                    <option value="4th">4th Year</option>
                </select>
            </div>


            <h2>Select Subjects</h2>

            <p class="instruction">
                Select exactly <strong>5 subjects</strong> from the list below.
            </p>

            <div class="subjects">

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="DSA">
                    <span>Data Structures & Algorithms</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="DBMS">
                    <span>Database Management System</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="OS">
                    <span>Operating Systems</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="CN">
                    <span>Computer Networks</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="AI">
                    <span>Artificial Intelligence</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="ML">
                    <span>Machine Learning</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="Web">
                    <span>Web Development</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="Java">
                    <span>Java Programming</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="Python">
                    <span>Python Programming</span>
                </label>

                <label class="subject-card">
                    <input type="checkbox" name="subject" value="Maths">
                    <span>Engineering Mathematics</span>
                </label>

            </div>


            <!-- Comments -->
            <div class="form-group">
                <label for="comments">Any Other Comments</label>

                <textarea id="comments" name="comments"
                          rows="5"
                          placeholder="Write your comments here..."></textarea>
            </div>


            <!-- Buttons -->
            <div class="button-group">

                <button type="submit" class="submit-btn">
                    Submit Registration
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>
</html>
