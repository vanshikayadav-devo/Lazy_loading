<!DOCTYPE html>
<html>
<head>
    <title>Three Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        .internal {
            color: green;
            font-size: 20px;
            background-color: burlywood;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="background-color: rgb(158, 108, 133);">
        Three Types of CSS
    </h1>

    <p class="internal">
         Internal CSS.
         <ul>
            <li>GREEN</li>
            <li>YELLOW</li>
            <li>RED</li>
         </ul>
    </p>

    <p class="external">
         External CSS.
         <p>hello this the content styled by the external css</p>
    </p>

    <p style="color: red; font-weight: bold;">
         Inline CSS.
         <ul >
            <li style="color:green">GREEN</li>
            <li style="color:blue">BLUE</li>
            <li style="color:yellow">YELLOW</li>
         </ul>
    </p>

</body>
</html>
